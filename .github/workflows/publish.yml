name: docker_publish

on:
  push:
    branches:
      - 'main'
      - 'release/*'
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      skip-lint-test:
        description: "Skip tests"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint_test:
    uses: babylonlabs-io/.github/.github/workflows/reusable_go_lint_test.yml@98e4de18638b3d0738c9cbf7e7dfc6e34524db54 # v0.19.1 https://github.com/babylonlabs-io/.github/releases/tag/v0.19.1
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs['skip-lint-test'] == true) }}
    with:
      go-version: '1.26.10'
      go-lint-version: 'v2.11.4'
      run-unit-tests: true
      run-lint: true
      run-build: true

  e2e_babylon:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 https://github.com/actions/checkout/releases/tag/v6.0.2
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0 https://github.com/actions/setup-go/releases/tag/v5.6.0
        with:
          go-version: '1.26.10'
      - name: Run gosec with the configured Go toolchain
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.24.7 -exclude-generated -exclude-dir=itest -exclude-dir=testutil ./...
      - name: Run e2e Babylon tests
        run: make test-e2e-babylon

  docker_pipeline:
    # Always evaluate, but only proceed if:
    # - skip is enabled, or lint, gosec and e2e succeeded (normal path)
    if: ${{ always() && (
            (github.event_name == 'workflow_dispatch' && inputs['skip-lint-test'] == true) ||
            (needs.lint_test.result == 'success' && needs.e2e_babylon.result == 'success')
          )}}
    needs: ["lint_test", "e2e_babylon"]
    uses: babylonlabs-io/.github/.github/workflows/reusable_docker_pipeline.yml@98e4de18638b3d0738c9cbf7e7dfc6e34524db54 # v0.19.1 https://github.com/babylonlabs-io/.github/releases/tag/v0.19.1
    with:
      publish: true
    permissions:
      contents: read
      id-token: write
      security-events: write
      packages: read
